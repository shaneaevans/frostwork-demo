name: Demo integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            dependencies: floors
          - python: "3.13"
            dependencies: locked
          - python: "3.14"
            dependencies: locked
          - python: "3.14"
            dependencies: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.8.22
      - if: matrix.dependencies == 'latest'
        run: uv lock --upgrade --python '${{ matrix.python }}'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - if: matrix.dependencies == 'floors'
        run: uv pip install --python .venv/bin/python 'frostwork[webpoet]==0.2.2' 'scrapy==2.20.0' 'scrapy-poet==0.26.0' 'zyte-common-items==0.29.0'
      - run: uv pip check --python .venv/bin/python
      # Do not sync away the floor overrides while running their tests.
      - run: .venv/bin/python -m pytest -m 'not browser'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked --extra browser --python 3.13
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: .venv/bin/python -m pytest -m browser
