[project]
name = "frostwork-demo"
version = "0.1.0"
description = "Demo: Frostwork as the one-pass, DOM-free extraction backend inside Scrapy + web-poet."
requires-python = ">=3.13"
dependencies = [
    # The web-poet bridge lives in frostwork.webpoet; the [webpoet] extra pulls in web-poet.
    "frostwork[webpoet]",
    "scrapy>=2.11",
    "scrapy-poet>=0.24",
    "zyte-common-items>=0.20",
    # Zyte's price parser — robust amount extraction for the page objects (see demo/prices.py).
    "price-parser>=0.3.4",
    "pytest>=7",
]

[tool.pytest.ini_options]
# Tests import the `demo` package from the repo root.
pythonpath = ["."]
testpaths = ["tests"]

# Consume the library straight off disk, editable — no PyPI, no network. Python-side edits in
# frostwork show up immediately; Rust edits need a rebuild (see README).
#
# The path is a STABLE in-repo location: `vendor/frostwork` is a gitignored symlink that `./setup.sh`
# creates by finding the library checkout (sibling, ~/src, or $FROSTWORK_DIR). This keeps the
# committed path machine-independent — run `./setup.sh`, not a bare `uv sync`.
[tool.uv.sources]
frostwork = { path = "vendor/frostwork", editable = true }

# This is an application, not a library: install the dependencies into the venv but don't try to
# build/package the `demo` directory itself.
[tool.uv]
package = false
