[project]
name = "frostwork-demo"
version = "0.1.0"
description = "Demo: Frostwork as the one-pass, DOM-free extraction backend inside Scrapy + web-poet."
requires-python = ">=3.13"
dependencies = [
    # The web-poet bridge lives in frostwork.webpoet; the [webpoet] extra pulls in web-poet.
    "frostwork[webpoet]",
    # 2.14 is the floor that actually RESOLVES: scrapy <2.14 does not cap Twisted, and Twisted >=25.5
    # removed `_setAcceptableProtocols`, which those releases import. The demo runs fine on 2.11 with
    # an old Twisted pinned by hand — but a fresh install of that combination is broken, so don't
    # advertise it.
    "scrapy>=2.14",
    # 0.26 is where `scrapy_poet.Addon` appears (demo/settings.py wires the integration through
    # ADDONS). On 0.24/0.25 every crawl dies at startup with
    # "Module 'scrapy_poet' doesn't define any object named 'Addon'".
    "scrapy-poet>=0.26",
    "zyte-common-items>=0.20",
    # Zyte's price parser — robust amount extraction for the page objects (see demo/prices.py).
    "price-parser>=0.3.4",
    "pytest>=7",
]

# The browser path (demo/browser.py, `scrapy crawl commerce_browser`): Frostwork's FrostBrowserPage
# over a rendered DOM instead of the bytes off the wire. Optional because it pulls a browser:
#
#   uv sync --extra browser && uv run playwright install chromium
[project.optional-dependencies]
browser = ["scrapy-playwright>=0.0.43"]

[tool.pytest.ini_options]
# Tests import the `demo` package from the repo root.
pythonpath = ["."]
testpaths = ["tests"]

# Consume the library straight off disk, editable — no PyPI, no network. Python-side edits in
# frostwork show up immediately; Rust edits need a rebuild (see README).
#
# The path is a STABLE in-repo location: `vendor/frostwork` is a gitignored symlink that `./setup.sh`
# creates by finding the library checkout (sibling, ~/src, or $FROSTWORK_DIR). This keeps the
# committed path machine-independent — run `./setup.sh`, not a bare `uv sync`.
[tool.uv.sources]
frostwork = { path = "vendor/frostwork", editable = true }

# This is an application, not a library: install the dependencies into the venv but don't try to
# build/package the `demo` directory itself.
[tool.uv]
package = false
