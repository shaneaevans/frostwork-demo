[project]
name = "frostwork-demo"
version = "0.1.0"
description = "Runnable Frostwork examples for Scrapy, ItemLoader, web-poet and browsers."
requires-python = ">=3.10"
dependencies = [
    "frostwork[webpoet]>=0.1.3,<0.2",
    "scrapy>=2.14,<3",
    "scrapy-poet>=0.26,<0.28",
    "zyte-common-items>=0.29,<0.30",
    "price-parser>=0.3.4",
]

[project.optional-dependencies]
browser = ["scrapy-playwright>=0.0.43,<0.1"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["browser: requires the browser extra and an installed Chromium"]

[tool.uv]
package = false
